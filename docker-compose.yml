name: personal-feed-story

services:
  douk:
    # Built from the pinned upstream tag (see douk/Dockerfile) instead of a floating image tag.
    build:
      context: ./douk
      args:
        DOUK_REF: "5.8"
    image: personal-feed-story/douk:5.8
    pull_policy: build
    # No published ports: DouK has no auth, so it must only be reachable from backend.
    volumes:
      - ./douk/volume:/app/Volume
    stdin_open: true
    tty: true
    restart: unless-stopped

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: feed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feed}
      POSTGRES_DB: feed
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feed -d feed"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  backend:
    build: ./backend
    image: personal-feed-story/backend:dev
    pull_policy: build
    env_file: ./backend/.env
    environment: &backend-env
      DOUK_BASE_URL: http://douk:5555
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://feed:${POSTGRES_PASSWORD:-feed}@postgres:5432/feed
      LIBRARY_DIR: /data/library
    volumes: &backend-volumes
      - ./backend/secrets:/app/secrets:ro
      - ./data/library:/data/library
      # Key for cookies saved on the Session page. Keep it out of backups shared with others.
      - ./data/secrets:/data/secrets
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      douk:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: personal-feed-story/backend:dev
    pull_policy: never
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: ./backend/.env
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
